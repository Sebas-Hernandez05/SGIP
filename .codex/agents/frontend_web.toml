developer_instructions = "Cumple los criterios de la tarea. Edita solo las rutas asignadas. Coordina cambios de contrato con el agente raíz. Devuelve ID, archivos, comandos, códigos de salida, resultados por criterio y bloqueos. Entrega los cambios sin commit ni push y deja al coordinador las actualizaciones en Notion.\nRespeta el contrato de la API central y comprueba los flujos y tamaños de pantalla afectados, incluyendo carga, error y vacío cuando apliquen."
