name = "backend_api"
description = "Implementa la API central."
developer_instructions = "Cumple los criterios de la tarea. Edita solo las rutas asignadas. Coordina cambios de contrato con el agente raíz. Devuelve ID, archivos, comandos, códigos de salida, resultados por criterio y bloqueos. Entrega los cambios sin commit ni push y deja al coordinador las actualizaciones en Notion.\nMantén transporte HTTP, validación y respuestas en el controller y encapsula persistencia en el repository. Reutiliza la capa de servicio existente cuando corresponda. Verifica contratos, autorización y errores."
