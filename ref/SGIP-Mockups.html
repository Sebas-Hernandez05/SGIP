const screens=[["UIW-01", "Registro de ciudadano", "Ciudadano", "Formulario de registro, datos de contacto, credenciales, validación y confirmación.", "RF-001", "Etiquetas persistentes, indicación de campos obligatorios, errores asociados al campo y sugerencias de corrección; no depender solo del color."], ["UIW-02", "Inicio de sesión", "Todos los roles web: ciudadano, funcionario y administrador", "Correo/identificador, contraseña, mostrar/ocultar contraseña accesible y mensajes de autenticación.", "RF-002, RF-003", "Etiquetas accesibles, navegación por teclado, errores anunciados sin revelar información sensible y compatibilidad con gestores de contraseñas."], ["UIW-03", "Panel del ciudadano", "Ciudadano", "Resumen de reportes propios, estado, fecha, identificador y accesos a detalle y creación.", "RF-025, RF-026, RF-027", "Estado expresado en texto, tabla/lista con encabezados claros, filtros accesibles y datos limitados a reportes del ciudadano (RR-04)."], ["UIW-04", "Crear reporte urbano", "Ciudadano", "Descripción, ubicación aproximada, categoría si aplica al flujo, fotografía opcional y envío.", "RF-020, RF-021, RF-022, RF-024, RF-025", "Instrucciones claras, límites y formatos de archivo indicados, alternativa textual al mapa, errores resumidos y vinculados a los campos; confirmación del registro e identificador."], ["UIW-05", "Detalle y seguimiento de reporte", "Ciudadano", "Estado actual, identificador, historial, comentarios, evidencias y acciones permitidas.", "RF-025, RF-026, RF-027, RF-048, RF-050, RF-053", "Historial en orden lógico, fechas legibles, estados no comunicados solo por color, imágenes con texto alternativo y contenido organizado por encabezados."], ["UIW-06", "Gestión y clasificación de reportes", "Funcionario", "Cola de reportes, búsqueda y filtros; edición de categoría y revisión de datos del caso.", "RF-023, RF-028, RF-029", "Filtros con etiquetas, resultados anunciados, navegación por teclado y confirmación antes de cambios; distinguir claramente candidatos a duplicado de duplicados confirmados (RR-05)."], ["UIW-07", "Revisión de recomendaciones de IA", "Funcionario", "Ver categoría/prioridad sugeridas, resumen, justificación y opciones aceptar, modificar o rechazar.", "RF-030–RF-036", "Mostrar recomendación y decisión humana por separado; botones con nombres explícitos; avisar cambios de estado; no ejecutar operaciones críticas autónomamente (RR-01 y RR-02)."], ["UIW-08", "Revisión de posibles duplicados", "Funcionario", "Comparar reportes candidatos, zona, categoría, intervalo de tiempo y fotografías; confirmar o descartar.", "RF-028, RF-029", "No depender de similitud visual únicamente; proporcionar datos comparables en texto, descripción de imágenes y confirmación explícita de la decisión."], ["UIW-09", "Crear y asignar orden de trabajo", "Funcionario", "Selección del reporte, prioridad, fecha objetivo, recursos y cuadrilla compatible.", "RF-037–RF-041", "Campos y controles etiquetados, fechas con formato explícito, errores de validación comprensibles y explicación de incompatibilidad de capacidades o zona."], ["UIW-10", "Gestión de usuarios, cuadrillas y configuración", "Administrador", "Administración de cuentas, cuadrillas, capacidades, zonas, categorías, prioridades, estados y tipos de evidencia.", "RF-005–RF-019", "Tablas accesibles, acciones nombradas, confirmación para activar/desactivar, formularios consistentes y feedback de éxito/error perceptible."], ["UIW-11", "Panel de indicadores y casos vencidos", "Funcionario, administrador", "Indicadores por categoría y zona, tiempos de atención, casos vencidos y filtros.", "RF-054–RF-059", "Gráficos acompañados por resumen o tabla textual; patrones y etiquetas además de color; controles accesibles y datos legibles al ampliar."], ["UIW-12", "Notificaciones y validación ciudadana", "Ciudadano; funcionario como receptor de alertas", "Consulta de notificaciones, solicitudes de información y valoración de la atención.", "RF-048–RF-051, RF-059", icio, pausa y reanudación.", "RF-043, RF-044", "Controles táctiles adecuados, estado actual anunciado, acciones separadas y claramente nombradas, prevención de activaciones accidentales y confirmación del cambio."], ["UIM-07", "Registrar evidencias y cerrar actividad", "Cuadrilla", "Adjuntar evidencias antes, durante o después de la intervención, añadir descripción y cerrar actividad.", "RF-045, RF-047", "Alternativa a captura directa, descripción del archivo, progreso de carga anunciado, errores comprensibles y confirmación antes del cierre."], ["UIM-08", "Notificaciones y avisos operativos", "Ciudadano; cuadrilla; administrador si aplica", "Consultar avisos de cambio de estado, cierre o información operativa disponible para el rol.", "RF-048–RF-050, RF-059", "No depender exclusivamente de notificaciones del sistema operativo; contenido accesible dentro de la app, texto claro y controles compatibles con lector de pantalla."], ["UIM-09", "Validación ciudadana de atención", "Ciudadano", "Registrar si la atención fue satisfactoria y, opcionalmente, un comentario.", "RF-051", "Etiquetas explícitas para opciones, no usar solo iconos, selección accesible con lector de pantalla y confirmación de envío."], ["UIM-10", "Configuración administrativa móvil (por confirmar)", "Administrador", "Acceso adaptable a las funciones de configuración si se confirma su inclusión en móvil.", "RF-005–RF-019", "Reutilizar criterios de formularios, tablas y confirmaciones de UIW; documentar alcance y probar con tecnologías de asistencia en móvil."]];

function dashboard(m){return heading('Mi ciudad · Mi participación','Hola, Valentina','Cada reporte cuenta para cuidar Pereira.',link('+ Crear reporte',m?'UIM-03':'UIW-04','primary'))+stats([['03','Mis reportes','Registrados'],['01','En atención','Equipo asignado'],['01','Resuelto','Por validar']])+card('Mis reportes',filters()+reportList(m))+(!m?card('Un espacio público mejor, entre todos',`<div class="grid equal"><div><p class="muted">Una luminaria, una calle, un parque. Cuéntanos qué necesita atención y acompaña su solución.</p>${link('Registrar una incidencia','UIW-04')}</div>${map()}</div>`):'')}
function createReport(m){return heading('Nuevo reporte','Cuéntanos qué sucede','Los campos con * son obligatorios.')+`<form onsubmit="event.preventDefault();confirmAction('Enviar reporte','Se registrará un caso de demostración con la información ingresada.',()=>{toast('Reporte SGIP-0250 registrado correctamente');go('${m?'UIM-04':'UIW-05'}')})"><div class="grid"><div>${card('01 · Describe la situación',area('¿Qué necesita atención?','')+select('Categoría sugerida (opcional)',['Sin sugerencia','Alumbrado público','Residuos','Vías','Fugas','Árboles en riesgo'])+'<p class="hint">Un funcionario revisará la clasificación final.</p>')}${card('02 · Ubicación',map()+field('Dirección o referencia','','text')+select('Zona',['Centro','Cuba','Boston'])+btn('⌖ Usar ubicación de ejemplo',"this.previousElementSibling.previousElementSibling.querySelector('input').value='Calle 19 con carrera 8, Pereira';toast('Ubicación de ejemplo aplicada')")+'<p class="hint">Puedes escribir la ubicación manualmente. Este mockup no solicita acceso al GPS.</p>')}</div><div>${card('03 · Añade contexto',upload()+area('Descripción de la fotografía','',false))}${card('Antes de enviar','<p class="muted">Verifica la dirección y describe el problema con claridad. La fotografía es opcional.</p><p class="hint">Recibirás un identificador para consultar el seguimiento.</p>')}</div></div><div class="actions end">${link('Cancelar',m?'UIM-02':'UIW-03')}<button class="primary">Enviar reporte →</button></div></form>`}

function execution(){return heading('OT-0086 / SGIP-0248','Reparación de luminaria','Cuadrilla Alumbrado Centro',tag(activity,activity==='Pausada'?'amber':''))+card('Antes de comenzar','<p>Asegura y señaliza el área. Inspecciona la luminaria y las conexiones antes de reemplazar componentes.</p><p><strong>Recursos:</strong> vehículo canasta, luminaria LED, equipo de protección.</p>')+card('Control de actividad',`<div class="eyebrow">Estado actual</div><h2>${activity}</h2><div class="actions">${activity==='Pendiente de inicio'?btn('Iniciar actividad',"changeActivity('En ejecución')",'primary'):activity==='En ejecución'?btn('Pausar actividad',"changeActivity('Pausada')") :activity==='Pausada'?btn('Reanudar actividad',"changeActivity('En ejecución')",'primary'):'<p>Actividad cerrada.</p>'}</div>${activity==='Pausada'?'<div class="notice warn" style="margin-top:16px">Pausa registrada. Reanuda cuando puedas continuar.</div>':''}`)+card('Registro de jornada','<p><strong>09:10</strong> · Orden aceptada por el equipo.</p><p class="muted">Los cambios de actividad se reflejan en esta demostración durante la sesión.</p>')+link('Registrar evidencias →','UIM-07','primary')}
function evidence(){return heading('OT-0086 / Intervención','Documenta el resultado','Añade evidencias y registra el cierre de actividad.')+`<form onsubmit="event.preventDefault();confirmAction('Cerrar actividad','Se registrará el cierre de la actividad. Esto no cierra automáticamente la orden ni el reporte.',()=>{activity='Cerrada';toast('Actividad cerrada; orden y reporte conservan su estado');go('UIM-06')})">${card('Evidencia de intervención',select('Momento de la evidencia',['Antes','Durante','Después'])+upload('Seleccionar fotografía')+area('Descripción de la evidencia','')+'<p class="hint">La captura directa puede sustituirse por selección de archivo.</p>')}${card('Resultado de la actividad',area('Trabajo realizado','')+`<div class="notice">El cierre corresponde a esta actividad. La orden y el reporte mantienen su seguimiento independiente.</div><label><input type="checkbox" required>Confirmo que revisé la información registrada.</label><button class="primary">Confirmar cierre de actividad</button>`)}</form>`}
function content(){let m=current.startsWith('UIM');let n=+current.slice(-2);if(m){return [null,()=>auth(true,authMode==='register'),()=>dashboard(true),()=>createReport(true),()=>detail(true),orders,execution,evidence,()=>notifications(true),()=>heading('SGIP-0226 / Resuelto','Tu opinión cuenta','Ayúdanos a evaluar la atención.')+validation(),()=>admin(true)][n]()}return [null,()=>auth(false,true),()=>auth(false),()=>dashboard(false),()=>createReport(false),()=>detail(false),management,ai,duplicates,order,()=>admin(false),indicators,()=>notifications(false)][n]()}
function role(){if(current.startsWith('UIM'))return +current.slice(-2)>=5&&+current.slice(-2)<=7?'Cuadrilla':current==='UIM-10'?'Administrador':'Ciudadano';return ['UIW-06','UIW-07','UIW-08','UIW-09','UIW-11'].includes(current)?'Funcionario':current==='UIW-10'?'Administrador':'Ciudadano'}
function sidebar(){let r=role(),items=r==='Ciudadano'?[['Mis reportes','UIW-03'],['Crear reporte','UIW-04'],['Notificaciones','UIW-12']]:r==='Funcionario'?[['Reportes','UIW-06'],['Recomendaciones IA','UIW-07'],['Posibles duplicados','UIW-08'],['Órdenes de trabajo','UIW-09'],['Indicadores','UIW-11']]:[['Administración','UIW-10'],['Indicadores','UIW-11']];return `<aside><div class="brand"><span class="logo">↗</span> SGIP</div><div><div class="navLabel">${r.toUpperCase()}</div><nav aria-label="Navegación principal">${items.map(([t,id])=>link(t,id,current===id?'active':'')).join('')}</nav></div><div class="profile"><span class="avatar">${r==='Ciudadano'?'VR':'CL'}</span><strong>${r==='Ciudadano'?'Valentina Ríos':'Camila López'}</strong><p class="muted">${r} · Pereira</p>${link('Cerrar sesión','UIW-02')}</div></aside>`}
function catalog(){return `<div class="catalog">${heading('SGIP / Sistema de diseño','Una ciudad. Una experiencia.','22 interfaces conectadas para ciudadanos, funcionarios, cuadrillas y administradores.')}<div class="notice">Mockups HTML autocontenidos. Las acciones son simuladas y los datos ficticios. Abre cualquier interfaz desde el selector o las tarjetas. No hay autenticación, API, mapas reales ni almacenamiento persistente.</div><div class="swatches"><span style="background:#173d35;color:white">Bosque · #173D35</span><span style="background:#17634e;color:white">Verde · #17634E</span><span style="background:#d8ec91">Lima · #D8EC91</span></div><p>Identidad propuesta: marca tipográfica SGIP, señal de avance, formas suaves, tipografía de sistema y estados con texto. No se encontró un manual de marca en las secciones consultadas.</p><p><a href="https://app.notion.com/p/3de14e04c5cb809e9250e58428b4e44a" target="_blank" rel="noopener">Fuente: Modelos y Diagramas · 5.4.1 y 5.4.2</a></p><details class="card"><summary>Alcance, trazabilidad y decisiones pendientes</summary><p>Se conserva cada ID y los RF de las tablas de interfaces. La numeración RF presenta diferencias con el catálogo de casos de uso de la misma página; no se corrigió por inferencia.</p><p>UIM-10 y acceso administrativo móvil son propuestas por confirmar. Reapertura y respuesta a solicitudes de información no tienen un flujo autorizado completo. Cerrar actividad no cierra automáticamente orden y reporte.</p><p>Se incluyen etiquetas, foco visible, estados textuales, controles táctiles, alternativas textuales a mapas y avisos dinámicos. No se declara conformidad WCAG: requiere pruebas con lectores de pantalla y flujos integrados.</p><p>UIW-10/UIM-10 incluyen ocho catálogos. UIM-01 incluye ingreso y registro. UIW-12 y UIM-08 ofrecen variantes de avisos por rol.</p></details><div class="catalogGrid">${screens.map(s=>`<article class="catalogCard"><div class="row"><span class="eyebrow">${s[0]}</span>${tag(s[0].startsWith('UIW')?'Web':'Móvil','gray')}</div><h2>${s[1]}</h2><p>${s[3]}</p><small>${s[2]}</small><small>${s[4]}</small>${link('Abrir mockup →',s[0])}</article>`).join('')}</div></div>`}
function render(){let s=screens.find(x=>x[0]===current);$('#screenPicker').value=current;$('#meta').innerHTML=current==='catalog'?'<strong>Inventario completo · 12 UIW + 10 UIM</strong><small>Una propuesta visual compartida</small>':`<div><strong>${s[0]} · ${s[1]}</strong><small>${s[2]} · ${s[4]}</small></div><div class="tools">${btn('← Anterior',"step(-1)")}${btn('Siguiente →',"step(1)")}</div>`;if(current==='catalog'){$('#main').innerHTML=catalog();return}if(current.startsWith('UIM')){$('#main').innerHTML=`<div class="mobileStage"><div class="sideNote"><div class="screenNo">${current.slice(-2)}</div><div class="eyebrow">Experiencia móvil</div><h2>${s[1]}</h2><p>${s[3]}</p><p>${s[4]}</p></div><div class="phone"><div class="status"><span>9:41</span><span>●●● ▰</span></div><header class="phoneHead"><div class="row"><div class="brand"><span class="logo">↗</span> SGIP</div><small>${role()}</small></div></header><div class="phoneBody">${content()}</div><nav class="bottomNav" aria-label="Navegación móvil">${role()==='Administrador'?link('<span>⚙</span>Configuración','UIM-10'):role()==='Cuadrilla'?link('<span>▤</span>Órdenes','UIM-05')+link('<span>▷</span>Actividad','UIM-06')+link('<span>▧</span>Evidencias','UIM-07'):link('<span>⌂</span>Inicio','UIM-02')+link('<span>＋</span>Reportar','UIM-03')}${link('<span>♧</span>Avisos','UIM-08')}${link('<span>↪</span>Salir','UIM-01')}</nav></div><div class="sideNote"><div class="eyebrow">Diseñada para el contexto</div><p>${s[5]}</p><p>La vista se adapta al ancho del dispositivo. Los datos de ejemplo se comparten visualmente con web.</p></div></div>`}else if(['UIW-01','UIW-02'].includes(current)){$('#main').innerHTML=content()}else{$('#main').innerHTML=`<div class="layout">${sidebar()}<div class="workspace"><header class="topbar"><small>Pereira / ${role()==='Ciudadano'?'Portal ciudadano':'Centro de gestión'}</small><div class="tools"><small>05 nov 2026</small>${link('Notificaciones', 'UIW-12')}</div></header><div class="content">${content()}</div></div></div>`}}
function go(id){if(!screens.some(s=>s[0]===id)&&id!=='catalog')id='catalog';current=id;location.hash=id;if(id==='UIW-12'&&!['Ciudadano','Funcionario'].includes(noticeRole))noticeRole='Ciudadano';render();window.scrollTo(0,0)}
function step(d){let i=screens.findIndex(s=>s[0]===current);go(screens[(i+d+screens.length)%screens.length][0])}
function toast(t){$('#toast').textContent=t;clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').textContent='',5000)}
function confirmAction(title,body,fn){$('#dialogTitle').textContent=title;$('#dialogBody').innerHTML=`<p>${body}</p>`;$('#confirm').onclick=()=>{$('#dialog').close();fn()};$('#dialog').showModal()}
function filterRows(q){let count=0;document.querySelectorAll('.searchable').forEach(r=>{let ok=r.textContent.toLowerCase().includes(q.toLowerCase());r.hidden=!ok;if(ok)count++});$('#results').textContent=`${count} reportes encontrados`}
function togglePassword(b){let i=b.parentNode.querySelector('input');i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'Mostrar':'Ocultar';b.type='button'}
function authenticate(form,m,reg){if(reg){let p=form.querySelectorAll('input[type=password],input[autocomplete=new-password]');if(p.length===2&&p[0].value!==p[1].value){form.querySelector('[role=alert]').textContent='Las contraseñas no coinciden. Revisa ambos campos.';return}toast('Cuenta de demostración creada');go(m?'UIM-02':'UIW-03')}else{let r=form.querySelector('select').value;go(m?(r==='Cuadrilla'?'UIM-05':'UIM-02'):(r==='Administrador'?'UIW-10':r==='Funcionario'?'UIW-06':'UIW-03'))}}
function previewFile(input){let f=input.files[0],box=input.closest('.upload').querySelector('.filePreview');if(!f)return;if(!['image/jpeg','image/png'].includes(f.type)||f.size>10485760){box.textContent='Archivo no válido. Usa JPG o PNG de hasta 10 MB.';input.value='';return}let u=URL.createObjectURL(f);box.innerHTML=`<img alt="Vista previa de la evidencia seleccionada" src="${u}" style="max-width:100%;max-height:150px;border-radius:8px"><p>${esc(f.name)} · Listo en el dispositivo (sin subida real)</p>`}
function decideDuplicate(yes){let r=$('#duplicateReason');if(!r.reportValidity())return;confirmAction(yes?'Confirmar duplicado':'Descartar coincidencia','Se registrará la decisión humana y su motivo; se conservará el historial.',()=>toast(yes?'Duplicado confirmado en la demostración':'Coincidencia descartada'))}
function changeActivity(s){confirmAction(s==='Pausada'?'Pausar actividad':s==='En ejecución'&&activity==='Pausada'?'Reanudar actividad':'Iniciar actividad',s==='Pausada'?'Indica el motivo de la pausa.<label>Motivo *<textarea id="pauseReason" required></textarea></label>':'Se registrará el cambio de estado de esta actividad.',()=>{activity=s;render();toast('Estado de actividad: '+s)});if(s==='Pausada'){let old=$('#confirm').onclick;$('#confirm').onclick=()=>{if($('#pauseReason').reportValidity())old()}}}
function toggleCatalog(i){let r=catalogs[adminTab][i];confirmAction(r[2]==='Inactivo'?'Activar registro':'Desactivar registro',`Se modificará el estado de ${esc(r[0])}.`,()=>{r[2]=r[2]==='Inactivo'?'Activo':'Inactivo';render();toast('Estado actualizado')})}
function editCatalog(i){let r=i===undefined?['','']:catalogs[adminTab][i];let labels={Usuarios:['Nombre completo','Perfil y correo'],Cuadrillas:['Nombre de la cuadrilla','Capacidades y áreas responsables'],Capacidades:['Nombre de la capacidad','Especialidad'],Zonas:['Nombre de la zona','Cobertura'],Categorías:['Nombre de la categoría','Descripción'],Prioridades:['Nivel de prioridad','Tiempo objetivo de atención'],Estados:['Nombre del estado','Entidad y descripción'],Evidencias:['Tipo de evidencia','Descripción']};confirmAction(i===undefined?'Crear registro':'Editar registro',`<form id="catalogForm">${field(labels[adminTab][0],esc(r[0]))}${field(labels[adminTab][1],esc(r[1]))}</form>`,()=>{});$('#confirm').onclick=()=>{let f=$('#catalogForm');if(!f.reportValidity())return;let vals=[...f.querySelectorAll('input')].map(x=>x.value);if(i===undefined)catalogs[adminTab].push(vals);else catalogs[adminTab][i]=[...vals,r[2]];$('#dialog').close();render();toast('Registro guardado en esta sesión')}}
$('#screenPicker').innerHTML='<option value="catalog">Índice de interfaces</option>'+screens.map(s=>`<option value="${s[0]}">${s[0]} · ${s[1]}</option>`).join('');$('#screenPicker').onchange=e=>go(e.target.value);window.addEventListener('hashchange',()=>{let id=location.hash.slice(1);if(id!==current)go(id)});document.addEventListener('click',e=>{let b=e.target.closest('button');if(b&&b.hasAttribute('onclick')&&b.closest('form'))e.preventDefault()});go(location.hash.slice(1)||'UIW-03');
</script></body></html>
